<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Online ICS feed viewer</title>
<script src="./lib/fullcalendar.global.min.js"></script>
<script src="./lib/ical.min.js"></script>
<script src="./urlhash.js"></script>
<script src="./script.js"></script>
<style>

  body {
    margin: 10px;
    padding: 0;
    font-family: "Lucida Grande", Helvetica, Arial, Verdana, sans-serif;
    font-size: 14px;
  }

  #calendar, header, h1, #status, #tz-bar {
    max-width: 900px;
    margin: 0 auto;
  }
  #tz-bar {
    margin-bottom: 10px;
  }
  #tz-select {
    font-size: 13px;
    padding: 3px 6px;
  }
  .fc-event{
    cursor: pointer;
  }
  .fc-timegrid-event {
    min-height: 25px;
    overflow: hidden;
  }
  body.from_url header,
  body.from_url #tz-bar,
  body.from_url h1 {
    display: none;
  }
  body.from_url {
    margin: 0;
  }
  header, h1 {
    margin: 0 auto 20px;
  }
  header input[type="text"] {
    flex: 1;
    font-size: medium;
    padding: 4px;
  }
  header button {
    background: #2196F3;
    color: #fff;
    border: 1px solid #1976D2;
    border-radius: 3px;
    cursor: pointer;
    font-size: medium;
    padding: 4px 12px;
    white-space: nowrap;
    min-width: 160px;
  }
  header button:hover {
    background: #1976D2;
  }
  #ics-text {
    flex: 1;
    box-sizing: border-box;
    font-family: monospace;
    font-size: 12px;
    padding: 4px;
  }
  .line {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .action {
    margin: 0 0 14px;
  }
  .action-label {
    font-weight: 600;
    margin-bottom: 4px;
    color: #444;
  }
  .action #myfile {
    flex: 1;
  }
  .action .hint {
    display: inline-block;
    margin-top: 6px;
    font-size: 13px;
    color: #555;
  }
  .action-reset {
    justify-content: flex-end;
  }
  .action-reset button {
    background: #fff;
    color: #555;
    border: 1px solid #ccc;
  }
  .action-reset button:hover {
    background: #f0f0f0;
  }
  #share-link {
    color: #1976D2;
    text-decoration: none;
    margin-right: 4px;
    font-size: 13px;
  }
  #share-link:hover {
    text-decoration: underline;
  }

  #topbar {
    position: fixed;
    top: 6px; right: 8px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(255,255,255,0.85);
    padding: 3px 8px;
    border: 1px solid #eee;
    border-radius: 4px;
    font-size: 12px;
    z-index: 1000;
  }
  #topbar button {
    background: transparent;
    color: #555;
    border: none;
    cursor: pointer;
    padding: 0;
    font: inherit;
  }
  #topbar button:hover,
  #topbar a:hover {
    color: #1976D2;
  }
  #topbar a {
    color: #555;
    text-decoration: none;
  }
  #topbar .sep {
    color: #ccc;
  }

  #status {
    margin: 8px auto;
    color: #555;
  }
  #status.error {
    color: #b00;
  }

  #popup {
    position:fixed;
    top: 0px;
    left: 0px;
    background:rgba(0,0,0,0.5);
    width: 100%;
    height: 100%;
    z-index: 1000;
    display: none;
  }
  #popup-content {
    max-width: 900px;
    margin: 0 auto;
    box-sizing: border-box;
    padding: 20px;
    margin-top: 300px;
    background: #fff;
    position: relative;
  }
  #popup-content span {
    display: block;
  }
  .popup-time {
    color: #666;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .popup-link {
    display: block;
    margin-top: 10px;
    color: #2196F3;
  }
  #popup-raw-toggle {
    margin-top: 10px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  #popup-raw {
    display: none;
    margin-top: 8px;
    padding: 10px;
    background: #f5f5f5;
    border: 1px solid #ddd;
    font-size: 12px;
    max-height: 300px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #popup-close {
    width: 30px;
    height: 30px;
    position: absolute;
    top: -15px;
    right: -15px;
    border-radius: 30px;
    background: #000;
    font-size: 22px;
    text-align: center;
    color: #fff;
    text-decoration:none;
  }

</style>
</head>
<body>
  <div id="topbar">
    <button id="toggle-form" type="button">Hide form</button>
    <span class="sep">|</span>
    <a href="https://github.com/adutton/online-ics-feed-viewer" target="_blank" rel="noopener">source</a>
  </div>
  <h1>Online ICS / iCal feed viewer</h1>
  <header>
    <form class="action" id="fetch-form">
      <div class="action-label">Fetch from a URL</div>
      <div class="line">
        <input type="text" id="eventsource" placeholder="copy/paste the url and press fetch...">
        <button id="fetch" type="submit">Fetch URL</button>
      </div>
      <label class="hint"><input type="checkbox" id="cors-enabled"> route through CORS proxy</label>
    </form>

    <div class="action">
      <div class="action-label">Load a local file</div>
      <div class="line">
        <input type="file" id="myfile" name="myfile" accept=".ics,text/calendar">
        <button id="load-file" type="button">Load File</button>
      </div>
    </div>

    <div class="action">
      <div class="action-label">Paste ICS contents</div>
      <div class="line">
        <textarea id="ics-text" rows="6" placeholder="BEGIN:VCALENDAR&#10;...&#10;END:VCALENDAR"></textarea>
        <button id="load-text" type="button">Render</button>
      </div>
    </div>

    <div class="line action-reset">
      <a href="#" id="share-link" hidden>Share this link</a>
    </div>
  </header>
  <div id="status"></div>
  <div id="tz-bar">
    <label for="tz-select">Convert to timezone:</label>
    <select id="tz-select">
      <option value="local">Browser timezone</option>
      <option value="UTC">UTC</option>
      <optgroup label="Americas">
        <option value="America/New_York">America/New_York (Eastern)</option>
        <option value="America/Chicago">America/Chicago (Central)</option>
        <option value="America/Denver">America/Denver (Mountain)</option>
        <option value="America/Los_Angeles">America/Los_Angeles (Pacific)</option>
        <option value="America/Anchorage">America/Anchorage (Alaska)</option>
        <option value="America/Sao_Paulo">America/Sao_Paulo</option>
      </optgroup>
      <optgroup label="Europe &amp; Africa">
        <option value="Europe/London">Europe/London (GMT/BST)</option>
        <option value="Europe/Paris">Europe/Paris (CET)</option>
        <option value="Europe/Berlin">Europe/Berlin (CET)</option>
        <option value="Europe/Moscow">Europe/Moscow (MSK)</option>
        <option value="Africa/Cairo">Africa/Cairo (EET)</option>
      </optgroup>
      <optgroup label="Asia &amp; Middle East">
        <option value="Asia/Dubai">Asia/Dubai (GST)</option>
        <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
        <option value="Asia/Shanghai">Asia/Shanghai (CST)</option>
        <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
        <option value="Asia/Seoul">Asia/Seoul (KST)</option>
        <option value="Asia/Singapore">Asia/Singapore (SGT)</option>
      </optgroup>
      <optgroup label="Oceania">
        <option value="Australia/Sydney">Australia/Sydney (AEST)</option>
        <option value="Pacific/Auckland">Pacific/Auckland (NZST)</option>
        <option value="Pacific/Honolulu">Pacific/Honolulu (HST)</option>
      </optgroup>
    </select>
  </div>
  <div id="calendar"></div>
  <div id="popup">
    <div id="popup-content">
      <h2></h2>
      <div class="popup-time"></div>
      <p></p>
      <a class="popup-link" href="#" target="_blank" style="display:none;">Follow the link</a>
      <button id="popup-raw-toggle">Raw</button>
      <pre id="popup-raw"></pre>
      <a id="popup-close" href="javascript:void(0)">&times;</a>
    </div>
  </div>
</body>
</html>
