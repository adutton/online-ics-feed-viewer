<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Online ICS feed viewer</title>
<script src="./lib/fullcalendar.global.min.js"></script>
<script src="./lib/ical.min.js"></script>
<script src="./urlhash.js"></script>
<script src="./script.js"></script>
<style>

  body {
    margin: 40px 10px;
    padding: 0;
    font-family: "Lucida Grande", Helvetica, Arial, Verdana, sans-serif;
    font-size: 14px;
  }

  #calendar, header, h1, footer, #tz-bar {
    max-width: 900px;
    margin: 0 auto;
  }
  #tz-bar {
    margin-bottom: 10px;
  }
  #tz-select {
    font-size: 13px;
    padding: 3px 6px;
  }
  .fc-event{
    cursor: pointer;
  }
  .fc-timegrid-event {
    min-height: 25px;
    overflow: hidden;
  }
  body.from_url header {
    display: none;
  }
  body.from_url #tz-bar {
    display: none;
  }
  body.from_url footer {
    display: none;
  }
  header, h1 {
    margin: 0 auto 20px
  }
  input[type="text"] {
    width: 70%;
    font-size: medium;
    padding: 4px
  }
  header button {
    font-size: medium;
    padding: 4px;
    width: 20%
  }
  #ics-text {
    width: 70%;
    font-family: monospace;
    font-size: 12px;
    padding: 4px;
    margin-top: 4px;
  }
  .line {
    display: flex;
  }

  small.source {
    position: absolute;
    right: 3px; bottom: 3px;
  }
  #share {
    display: none;
  }

  #popup {
    position:fixed;
    top: 0px;
    left: 0px;
    background:rgba(0,0,0,0.5);
    width: 100%;
    height: 100%;
    z-index: 1000;
    display: none;
  }
  #popup-content {
    max-width: 900px;
    margin: 0 auto;
    box-sizing: border-box;
    padding: 20px;
    margin-top: 300px;
    background: #fff;
    position: relative;
  }
  #popup-content span {
    display: block;
  }
  .popup-time {
    color: #666;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .popup-link {
    display: block;
    margin-top: 10px;
    color: #2196F3;
  }
  #popup-raw-toggle {
    margin-top: 10px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  #popup-raw {
    display: none;
    margin-top: 8px;
    padding: 10px;
    background: #f5f5f5;
    border: 1px solid #ddd;
    font-size: 12px;
    max-height: 300px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #popup-close {
    width: 30px;
    height: 30px;
    position: absolute;
    top: -15px;
    right: -15px;
    border-radius: 30px;
    background: #000;
    font-size: 22px;
    text-align: center;
    color: #fff;
    text-decoration:none;
  }

</style>
</head>
<body>
  <h1>Online ICS / iCal feed viewer</h1>
  <header>
    <p class="line">
    <input type="text" id="eventsource" placeholder="copy/paste the url and press fetch...">
    <button id="fetch">fetch</button><br>
    <label>CORS ignored?<input type="checkbox" id="cors-enabled" checked="checked"></label>
    </p>
    <p>
    <label for="myfile">or select local file</label>
    <input type="file" id="myfile" name="myfile"  onchange="openFile(event)">
    </p>
    <p>
    <label for="ics-text">or paste ICS text</label><br>
    <textarea id="ics-text" rows="6" placeholder="BEGIN:VCALENDAR&#10;...&#10;END:VCALENDAR"></textarea><br>
    <button id="load-text">load</button>
    </p>
  </header>
  <div id="tz-bar">
    <label for="tz-select">Convert to timezone:</label>
    <select id="tz-select">
      <option value="local">Browser timezone</option>
      <option value="UTC">UTC</option>
      <optgroup label="Americas">
        <option value="America/New_York">America/New_York (Eastern)</option>
        <option value="America/Chicago">America/Chicago (Central)</option>
        <option value="America/Denver">America/Denver (Mountain)</option>
        <option value="America/Los_Angeles">America/Los_Angeles (Pacific)</option>
        <option value="America/Anchorage">America/Anchorage (Alaska)</option>
        <option value="America/Sao_Paulo">America/Sao_Paulo</option>
      </optgroup>
      <optgroup label="Europe &amp; Africa">
        <option value="Europe/London">Europe/London (GMT/BST)</option>
        <option value="Europe/Paris">Europe/Paris (CET)</option>
        <option value="Europe/Berlin">Europe/Berlin (CET)</option>
        <option value="Europe/Moscow">Europe/Moscow (MSK)</option>
        <option value="Africa/Cairo">Africa/Cairo (EET)</option>
      </optgroup>
      <optgroup label="Asia &amp; Middle East">
        <option value="Asia/Dubai">Asia/Dubai (GST)</option>
        <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
        <option value="Asia/Shanghai">Asia/Shanghai (CST)</option>
        <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
        <option value="Asia/Seoul">Asia/Seoul (KST)</option>
        <option value="Asia/Singapore">Asia/Singapore (SGT)</option>
      </optgroup>
      <optgroup label="Oceania">
        <option value="Australia/Sydney">Australia/Sydney (AEST)</option>
        <option value="Pacific/Auckland">Pacific/Auckland (NZST)</option>
        <option value="Pacific/Honolulu">Pacific/Honolulu (HST)</option>
      </optgroup>
    </select>
  </div>
  <div id="calendar"></div>
  <div id="popup">
    <div id="popup-content">
      <h2></h2>
      <div class="popup-time"></div>
      <p></p>
      <a class="popup-link" href="#" target="_blank" style="display:none;">Follow the link</a>
      <button id="popup-raw-toggle">Raw</button>
      <pre id="popup-raw"></pre>
      <a id="popup-close" href="javascript:void(0)">&times;</a>
    </div>
  </div>
  <footer class="line" id="share">
    Hide input when sharing url:
    <input type="checkbox">
  </footer>
  <small class="source">
    <a href="https://github.com/adutton/online-ics-feed-viewer">source</a>
  </small>
</body>
</html>
